<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gama Hospital | AI Healthcare Concierge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Gama Hospital Background Image with Professional Dark Overlay */
            background: linear-gradient(rgba(0, 31, 63, 0.75), rgba(0, 31, 63, 0.75)), 
                        url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero-container {
            max-width: 800px;
            padding: 20px;
        }

        .hero-container h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }

        .hero-container p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #e0e0e0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .hospital-info {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hospital-info span {
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1>Gama Hospital AI Assistant</h1>
        <p>உங்களின் நல்வாழ்வுக்காக எங்களது மல்டி-ஸ்பெஷாலிட்டி AI உதவியாளர் 24 மணி நேரமும் சேவையில் உள்ளார்.</p>
        
        <div class="hospital-info">
            <span>📍 Al Qashlah, Dhahran, KSA</span> | 
            <span>📞 920033175</span> | 
            <span>🚨 24/7 Emergency</span>
        </div>
    </div>

    <!-- Botpress Webchat Scripts -->
    <script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/09/28/18/20260928184020-AYXBWQWJ.js" defer></script>

</body>
</html>
